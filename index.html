            "@type": "Answer",
            "text": "Ya, 100% bahan kemasan makanan kami menggunakan kertas standar foodgrade tersertifikasi FDA dan FSC. Kertas dilapisi pelindung PE anti-bocor dan anti-minyak yang tahan terhadap kuah panas, saus, maupun kelembapan microwave."

        {
          "@type": "Question",
          "name": "Bagaimana jika brand saya belum memiliki desain atau pola dieline kemasan?",

            "@type": "Answer",
            "text": "Tim desainer spesialis Packnesia siap membantu Anda! Kami menyediakan layanan pembuatan pola potong (dieline) presisi dan simulasi visual 3D Mockup kemasan secara GRATIS. Anda cukup mengirimkan logo brand dan ukuran wadah produk Anda."
          }
        },
        {
          "@type": "Question",
          "name": "Berapa lama estimasi waktu produksi cetak kemasan?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Apakah Packnesia melayani pengiriman ke luar pulau di seluruh Indonesia?",
